name: Android Build CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4  # <-- Yahan v3 se v4 kar diya

    - name: set up JDK 17
      uses: actions/setup-java@v4 # <-- Yahan bhi v4 kar diya
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build with Gradle
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4  # <-- Sabse zaruri change ye hai (v4)
      with:
        name: noteapp-debug
        path: app/build/outputs/apk/debug/app-debug.apk
